# Values come from the environment. Create a git-ignored .env in the repository root with:
#
#   POSTGRES_DB=finnavis
#   POSTGRES_USER=finnavis
#   POSTGRES_PASSWORD=<pick one>
#   API_PORT=8080
#   ASPNETCORE_ENVIRONMENT=Production
#
# docker compose reads that file automatically. Never commit it (CLAUDE.md Safety).

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # PostgreSQL 18 declares /var/lib/postgresql as the volume and keeps the cluster in
      # $PGDATA = /var/lib/postgresql/18/docker. Mounting the old /var/lib/postgresql/data
      # leaves the real cluster on the container layer, so `down -v` would not drop the data.
      - db-data:/var/lib/postgresql
    networks:
      - finnavis
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/FinNavis.Presentation/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__FinNavisDb: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    ports:
      # Bound to the loopback address on purpose: this feature has no authentication, so the
      # network boundary is the only access control (PRD §6.1, sad.md §7).
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - finnavis

volumes:
  db-data:

networks:
  finnavis:
    driver: bridge
